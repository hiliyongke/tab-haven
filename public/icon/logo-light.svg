<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Tabs Logo v12 — 斜体 T + 长腿（放大版 · 淡淡多巴胺底）
    奶油 → 蜜桃极淡渐变底 + 同款斜体珊瑚 T，浅色 UI 场景使用。
    几何与 logo.svg 完全一致（v11 → v12 仅整体放大 25%）。
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF6E9"/>
      <stop offset="100%" stop-color="#FFE7DF"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A75"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A6B"/>
      <stop offset="100%" stop-color="#F5665A"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <g transform="translate(64 64) skewX(10) translate(-64 -64)">
    <rect x="48" y="45" width="32" height="70" rx="9" fill="url(#stem)"/>
    <rect x="14" y="25" width="100" height="28" rx="14" fill="url(#bar)"/>
    <circle cx="106" cy="16" r="9" fill="#FFC94D"/>
  </g>
</svg>
