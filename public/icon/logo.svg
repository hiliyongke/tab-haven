<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Tabs logo：清新翡翠渐变底 + 两个叠放的浏览器窗口（横向，mac 三色控制点） -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5CBF8C"/>
      <stop offset="1" stop-color="#2E7D57"/>
    </linearGradient>
    <clipPath id="front"><rect x="22" y="48" width="76" height="56" rx="11"/></clipPath>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bg)"/>
  <!-- 后层窗口：半透明白剪影，错位叠于右上（同样宽 > 高） -->
  <rect x="38" y="26" width="66" height="50" rx="10" fill="#ffffff" opacity="0.4"/>
  <!-- 前层窗口 + 顶部标题栏（圆角内裁切） -->
  <rect x="22" y="48" width="76" height="56" rx="11" fill="#ffffff"/>
  <g clip-path="url(#front)">
    <rect x="22" y="48" width="76" height="15" fill="#2E7D57" opacity="0.14"/>
  </g>
  <!-- macOS 窗口控制点：红 / 黄 / 绿 -->
  <circle cx="28" cy="55.5" r="2.7" fill="#FF5F57"/>
  <circle cx="36" cy="55.5" r="2.7" fill="#FEBC2E"/>
  <circle cx="44" cy="55.5" r="2.7" fill="#28C840"/>
</svg>
