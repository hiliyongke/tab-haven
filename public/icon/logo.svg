<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!--
    Tabs Logo v12 — 斜体 T + 长腿（放大版）

    v11 → v12 只做了一件事：整体放大 25%（以画布中心为原点），
    其余设计（居中、向右倾斜 10°、笔画比例、奶油黄点位置）与 v11 完全一致。
    横画 80 → 100、竖画 26 → 32 / 56 → 70，工具栏小尺寸下更醒目。
  -->
  <defs>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF8A75"/>
      <stop offset="100%" stop-color="#FF6B5B"/>
    </linearGradient>
    <linearGradient id="stem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF7A6B"/>
      <stop offset="100%" stop-color="#F5665A"/>
    </linearGradient>
  </defs>

  <g transform="translate(64 64) skewX(10) translate(-64 -64)">
    <!-- 长腿：竖画先画，横画后画盖住顶部，接缝干净 -->
    <rect x="48" y="45" width="32" height="70" rx="9" fill="url(#stem)"/>
    <rect x="14" y="25" width="100" height="28" rx="14" fill="url(#bar)"/>

    <!-- 奶油黄活力点 -->
    <circle cx="106" cy="16" r="9" fill="#FFC94D"/>
  </g>
</svg>
